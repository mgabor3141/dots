{{- if ne .chezmoi.os "darwin" }}
{{- /* Latest stable pingdotgg/t3code release for linux x86_64. Asset names embed the
     version, so the URL is resolved at render time (gitHubLatestRelease skips
     prereleases, i.e. nightly/preview builds). */ -}}
{{- $url := "" -}}
{{- range (gitHubLatestRelease "pingdotgg/t3code").Assets -}}
{{- if hasSuffix "-x86_64.AppImage" .Name -}}
{{- $url = .BrowserDownloadURL -}}
{{- break -}}
{{- end -}}
{{- end -}}
{{- if $url }}
["T3-Code-x86_64.AppImage"]
    type = "file"
    url = "{{ $url }}"
    executable = true
    refreshPeriod = "24h"
{{- end }}
{{- end }}
