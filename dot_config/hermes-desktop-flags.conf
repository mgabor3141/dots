# Hermes Desktop — Electron launch flags.
# One Electron/Chromium flag per line. Blank lines and whole-line
# comments (#) are ignored; do not put flags on the same line as a comment.
# See https://github.com/NousResearch/hermes-agent (apps/desktop).

# Prefer native Wayland when the compositor supports it; fall back to X11
# automatically otherwise. Electron handles this negotiation itself.
--ozone-platform-hint=auto
