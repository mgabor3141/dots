verbosity = "WARN"
media_minimum_duration = 5
idle_inhibitor = "wayland"
sink_whitelist = []

# Blacklist the virtual-sink → Scarlett bridge streams (system-audio-playback,
# comms-playback) and speech-dispatcher. The bridge streams are loopback
# module outputs that stay permanently connected and un-corked, which would
# otherwise make the idle inhibitor think audio is always playing.
# The helper matches a node's description before its node.name. These are the
# descriptions of the always-running virtual-sink → Scarlett bridge streams.
[[node_blacklist]]
name = "^(System Audio|Comms) → Scarlett$"

[[node_blacklist]]
name = "speech-dispatcher.*"

# Zen can leave muted/background tabs (notably X) uncorked even when no media
# is audibly playing. PipeWire state is therefore not a reliable playback
# signal for the browser; use its MPRIS PlayerStatus instead.
[[node_blacklist]]
app_name = "^Zen$"
